# This repo doubles as an omnibenchmark module so `ob validate module` (and the
# validate-module action) can run against it — the boilerplate's own CI dogfoods
# the action on itself. Real entrypoints (e.g. validators) come later; for now a
# placeholder satisfies the required `default` key.
entrypoints:
  default: run.sh

# Benchmarks this boilerplate scaffolds for. Each entry is one benchmark: a short
# LABEL (`name`, used by `implements`), the `repo`, and `plan` — the benchmark
# definition file within that repo (a repo may hold more than one). `ob` ignores
# these keys.
template-for:
  - name: split-stages
    repo: https://github.com/omni-scrna/split-stages-plan
    plan: benchmark_conda.yaml
    ref: main              # pin: tag/branch to vendor interfaces from

# Interfaces this module implements, as <benchmark-label>/<interface>@<version>.
# The interface is defined as data in src/common/schema/<interface>.json.
# (Illustrative here: this repo is a template that also self-validates; the
# example schema is src/common/schema/embedding.json.)
implements:
  - split-stages/embedding@0.1.0
