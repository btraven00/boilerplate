# This repo doubles as an omnibenchmark module so `ob validate module` (and the
# validate-module action) can run against it — the boilerplate's own CI dogfoods
# the action on itself. Real entrypoints (e.g. validators) come later; for now a
# placeholder satisfies the required `default` key.
entrypoints:
  default: run.sh

# The plan this boilerplate is the template for.
# It defines the benchmark repo and stages that will be used by this template.
# This will not be needed if we merge the boilerplate into the plan repo itself.
plan:
  repo: https://github.com/omni-scrna/split-stages-plan
  file: benchmark_conda.yaml   # the benchmark plan within that repo
  ref: main                    # pin: tag or branch to track benchmark schemas from
