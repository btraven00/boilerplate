# CI for the boilerplate repo itself — tests this repo's own deliverables.
#
# This does NOT run the catalog actions (a composite action only executes when
# another repo `uses:` it). It exercises what lives here: that docs stay in
# sync, and — once validators land — that validator logic works.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    name: Docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: prefix-dev/setup-pixi@v0.8.10
        with:
          manifest-path: pixi.toml
      - name: Embedded snippets are current
        # Fails if a doc's embedded file drifted from its source — run
        # `pixi run docs` locally to fix.
        run: pixi run docs-check

  validate-module:
    name: Self-validates as a module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The repo doubles as an omnibenchmark module (omnibenchmark.yaml), so we
      # dogfood the catalog action against ourselves — this is also the only
      # place the action runs live on GitHub.
      - uses: ./actions/validate-module
