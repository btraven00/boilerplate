# CI for the boilerplate repo itself — tests this repo's own deliverables.
#
# This does NOT run the catalog actions (a composite action only executes when
# another repo `uses:` it). Merges to main should be gated on both jobs being
# green (set branch protection to require "Checks" and "Self-validates").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          manifest-path: pixi.toml
      # Fetch the plan's real schema/ into the gitignored tests/fixtures/schema/
      # so the cli helpers are tested against the live contract — no checked-in
      # copy. No-op until the plan publishes schema/ on the pinned ref.
      - run: pixi run fetch-schema
      # docs-sync + ruff + mypy + Python/R tests for src/common. After the fetch
      # this is offline; reproduce locally with `pixi run fetch-schema && pixi run check`.
      - run: pixi run check

  validate-module:
    name: Self-validates as a module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The repo doubles as an omnibenchmark module (omnibenchmark.yaml), so we
      # dogfood the catalog action against ourselves — this is also the only
      # place the action runs live on GitHub.
      - uses: ./actions/validate-module
