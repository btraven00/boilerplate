# CI for the boilerplate repo itself — tests this repo's own deliverables.
#
# This does NOT run the catalog actions (a composite action only executes when
# another repo `uses:` it). Merges to main should be gated on both jobs being
# green (set branch protection to require "Checks" and "Self-validates").
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.6
        with:
          manifest-path: pixi.toml
      # docs-sync + ruff + mypy + Python/R tests for src/common. Run `pixi run
      # check` locally to reproduce. (Kept offline; the drift check below needs
      # network, so it's a separate step.)
      - run: pixi run check
      # Fail if the schema fixtures have drifted from the plan's published
      # schema/. No-op until the plan publishes schema/ on the pinned ref.
      - run: pixi run refresh-fixtures-check

  validate-module:
    name: Self-validates as a module
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The repo doubles as an omnibenchmark module (omnibenchmark.yaml), so we
      # dogfood the catalog action against ourselves — this is also the only
      # place the action runs live on GitHub.
      - uses: ./actions/validate-module
