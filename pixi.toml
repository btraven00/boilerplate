# Developer tasks for the boilerplate repo itself.
#
# This manifest is for working ON the template, not for modules generated FROM
# it. It is never copied into a module (Copier renders src/common/, not this).
# CI (.github/workflows/ci.yml) runs `pixi run check` and gates merges on it.

[workspace]
name = "boilerplate-dev"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.12,<3.14"
# To run the R side of src/common in tests. cli.R's runtime deps: jsonlite (reads
# the JSON schema) and argparser (the CLI parser — pure R, no Python).
r-base = ">=4.3"
r-jsonlite = "*"
r-argparser = "*"
# Minimal Python lint + typecheck. (R linting/typechecking intentionally omitted
# to keep the toolchain small — R has no standard type checker, and lintr is heavy.)
ruff = "*"
mypy = "*"
# Read omnibenchmark.yaml in the sync scripts (pull / fetch-schema).
pyyaml = "*"

[tasks]
# Re-embed file snippets into the docs (single source of truth = the real files).
docs = "python scripts/embed_snippets.py"
docs-check = "python scripts/embed_snippets.py --check"

# Fetch the plan's real schema/ into the gitignored tests/fixtures/schema/, so the
# cli helpers are tested against the real contract (no checked-in copy). CI runs
# this before `check`; run it locally before `test`. No-op until the plan publishes
# schema/ on the pinned ref. Needs network.
fetch-schema = "python scripts/fetch_schema.py"

# Vendor common code + interface schemas into a module at pinned refs (interim,
# pre-`ob`). pull.py is CWD-relative; a module author runs it from THEIR module
# root via a sibling checkout: `python ../boilerplate/scripts/pull.py`. This task
# runs it here (boilerplate root), so it's only useful for self-vendoring/testing.
pull = "python scripts/pull.py"

# Tests for src/common (Python + R).
test = { cmd = "python -m unittest discover -s tests -p 'test_*.py' && Rscript tests/test_cli.R" }

# Minimal quality gates.
lint = "ruff check src/common/python tests scripts"
typecheck = "mypy src/common/python"

# What CI runs and what merges are gated on. Keep this green.
check = { depends-on = ["docs-check", "lint", "typecheck", "test"] }
